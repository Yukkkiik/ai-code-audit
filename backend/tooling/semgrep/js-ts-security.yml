rules:
  - id: js-eval-injection
    languages: [javascript, typescript]
    severity: ERROR
    message: eval() mengeksekusi string sebagai kode. Jika string berasal dari input pengguna, ini memungkinkan eksekusi kode sembarang.
    patterns:
      - pattern: eval(...)
      - pattern-not: eval("...")
    metadata:
      category: security
      cwe: "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code ('Eval Injection')"
      owasp: "A03:2021 - Injection"

  - id: js-new-function
    languages: [javascript, typescript]
    severity: ERROR
    message: new Function() membuat fungsi dari string sehingga setara dengan eval(). Hindari membangun kode dari data dinamis.
    patterns:
      - pattern: new Function(...)
      - pattern-not: new Function("...")
    metadata:
      category: security
      cwe: "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code ('Eval Injection')"
      owasp: "A03:2021 - Injection"

  - id: js-child-process-dynamic-command
    languages: [javascript, typescript]
    severity: ERROR
    message: child_process.exec/execSync dengan perintah dinamis rentan terhadap command injection. Gunakan execFile/spawn dengan array argumen.
    patterns:
      - pattern-either:
          - pattern: child_process.exec($CMD, ...)
          - pattern: child_process.execSync($CMD, ...)
          - pattern: exec($CMD, ...)
          - pattern: execSync($CMD, ...)
      - pattern-not: child_process.$F("...", ...)
      - pattern-not: $F("...", ...)
    metadata:
      category: security
      cwe: "CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"
      owasp: "A03:2021 - Injection"

  - id: js-innerhtml-assignment
    languages: [javascript, typescript]
    severity: WARNING
    message: Menetapkan innerHTML/outerHTML dari nilai dinamis dapat menyebabkan XSS. Gunakan textContent atau sanitasi.
    patterns:
      - pattern-either:
          - pattern: $EL.innerHTML = $X
          - pattern: $EL.outerHTML = $X
      - pattern-not: $EL.innerHTML = "..."
      - pattern-not: $EL.outerHTML = "..."
    metadata:
      category: security
      cwe: "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
      owasp: "A03:2021 - Injection"

  - id: js-document-write
    languages: [javascript, typescript]
    severity: WARNING
    message: document.write() dengan data dinamis dapat menyebabkan XSS.
    patterns:
      - pattern: document.write($X)
      - pattern-not: document.write("...")
    metadata:
      category: security
      cwe: "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
      owasp: "A03:2021 - Injection"

  - id: js-weak-hash-algorithm
    languages: [javascript, typescript]
    severity: WARNING
    message: MD5 dan SHA-1 tidak aman untuk keperluan keamanan. Gunakan SHA-256 atau lebih kuat.
    pattern-either:
      - pattern: crypto.createHash("md5")
      - pattern: crypto.createHash("sha1")
    metadata:
      category: security
      cwe: "CWE-328: Use of Weak Hash"
      owasp: "A02:2021 - Cryptographic Failures"

  - id: js-tls-verification-disabled
    languages: [javascript, typescript]
    severity: ERROR
    message: Verifikasi sertifikat TLS dimatikan sehingga koneksi rentan terhadap serangan man-in-the-middle.
    pattern-either:
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"
      - pattern: |
          {..., rejectUnauthorized: false, ...}
    metadata:
      category: security
      cwe: "CWE-295: Improper Certificate Validation"
      owasp: "A07:2021 - Identification and Authentication Failures"
